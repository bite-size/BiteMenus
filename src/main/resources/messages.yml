prefix: '<#FF0368>[BiteMenus] '
error-prefix: '<#F7567C>!! '
# Variables:
# - <label> = command label.
# - <time> = time remaining for cooldown.
# - <menu> = name of the menu currently being interacted with.
# - <menus> = list of all menus.
# - <slot> = number slot that was interacted with.
# - <value> = row or flag value being displayed or set.
# - <cost> = cost of a transaction (e.g. "$10.00").
# - <title> = title of a menu.
# - <size> = size of a menu.
# - <date> = creation date of a menu.
# - <flag> = name of the flag being set.

errors:
  player-not-found: '<#F7567C>Player not found.'
  no-permission: '<#F7567C>No permission.'
  players-only: '<#F7567C>Only players can use this command.'
  usage-open: '<#F7567C>Usage: /<label> open <name>'
  menu-not-found: '<#F7567C>Menu not found.'
  usage-info: '<#F7567C>Usage: /<label> info <name>'
  invalid-name: '<#F7567C>Menu name can only contain alphanumeric characters, dashes, and underscores.'
  usage-create: '<#F7567C>Usage: /<label> create <name> <size> [title]'
  menu-exists: '<#F7567C>Menu already exists.'
  usage-edit: '<#F7567C>Usage: /<label> edit <name>'
  usage-resize: '<#F7567C>Usage: /<label> resize <name> <size>'
  invalid-size: '<#F7567C>Invalid size.'
  invalid-size-bounds: '<#F7567C>Size must be a multiple of 9, between 9 and 54.'
  usage-retitle: '<#F7567C>Usage: /<label> retitle <name> <title>'
  usage-remove: '<#F7567C>Usage: /<label> remove <name>'
  usage-button: '<#F7567C>Usage: /<label> button <command|menu|remove> <menu> [args...]'
  usage-button-command: '<#F7567C>Usage: /<label> button command <menu> <isPlayer> <cmd>'
  usage-button-menu: '<#F7567C>Usage: /<label> button menu <menu> <target>'
  button-not-found: '<#F7567C>No button found at slot <slot>.'
  unknown-action: '<#F7567C>Unknown button action.'
  usage-flag: '<#F7567C>Usage: /<label> flag list OR /<label> flag <menu> menu/button ...'
  usage-flag-general: '<#F7567C>Usage: /<label> flag <menu> menu/button <flag> <value>'
  usage-flag-menu: '<#F7567C>Usage: /<label> flag <menu> menu <flag> <value>'
  invalid-material: '<#F7567C>Invalid Material name.'
  unknown-menu-flag: '<#F7567C>Unknown menu flag.'
  usage-flag-button: '<#F7567C>Usage: /<label> flag <menu> button <flag> <value>'
  slot-no-button: '<#F7567C>This slot does not have a button! Please add one using <#4ECDC4>/<label> button command <gray>or <#4ECDC4>/<label> button menu<#F7567C>.'
  unknown-button-flag: '<#F7567C>Unknown button flag.'
  invalid-flag-target: "<#F7567C>Target must be 'menu' or 'button'."
  unknown-command: '<#F7567C>Unknown command.'
  cooldown: '<#F7567C>Please wait <#4ECDC4><time> <#F7567C>before doing that.'
  insufficient-funds: "<#F7567C>You don't have enough money."
  transaction-failed: '<#F7567C>Transaction failed.'
  vault-unavailable: '<#F7567C>Vault economy is not available! Contact an administrator.'
  invalid-boolean: '<#F7567C>Value must be true or false.'
  invalid-number: '<#F7567C>Value must be a valid number.'
  invalid-permission: '<#F7567C>Invalid permission format.'

messages:
  transaction-success: '<#4ECDC4>Purchased for <cost>.'
  loaded-menus: '<#4ECDC4>Loaded menus: <#F7FFF7><menus>'
  menu-created: '<#4ECDC4>Menu <menu> created.'
  opening-edit: '<#4ECDC4>Opening <menu> in Edit Mode.'
  menu-resized: '<#4ECDC4>Menu <menu> resized to <size>.'
  menu-retitled: '<#4ECDC4>Menu <menu> retitled to <title>.'
  menu-removed: '<#4ECDC4>Menu <menu> removed.'
  plugin-reloaded: '<#4ECDC4>Plugin reloaded.'
  button-command-added: '<#4ECDC4>Added command to slot <slot> in <menu>.'
  button-menu-added: '<#4ECDC4>Added menu link to slot <slot> in <menu>.'
  button-removed: '<#4ECDC4>Cleared actions and flags for slot <slot> in <menu>.'
  click-to-apply-action: '<#4ECDC4>Please click the slot you want to apply this action to!'
  flag-menu-set: '<#4ECDC4>Set menu flag <flag> to <value>.'
  flag-button-set: '<#4ECDC4>Set button flag <flag> to <value> at slot <slot>.'
  click-to-apply-flag: '<#4ECDC4>Please click the slot you want to apply this flag to!'
  selection-cancelled: '<#F7567C>Cancelled selection.'
  edit-mode-saved: '<#4ECDC4>Saved and exited Edit Mode for <menu>.'
  blank-slot-warning: '<#4ECDC4>Warning: You assigned a button to a blank slot!'

info:
  header: '<#4ECDC4>--- Menu Info: <menu> ---'
  title: '<gray>Title: <#F7FFF7><title>'
  size: '<gray>Size: <#F7FFF7><size>'
  auto-refresh: '<gray>Auto Refresh: <#F7FFF7><value>'
  filler-item: '<gray>Filler Item: <#F7FFF7><value>'
  permission: '<gray>Permission: <#F7FFF7><value>'
  total-buttons: '<gray>Total Buttons: <#F7FFF7><value>'
  created-date: '<gray>Created: <#F7FFF7><date>'

help:
  header: '<#4ECDC4>--- BiteMenus Help ---'
  open: '<gray>- /<label> open <name>'
  list: '<gray>- /<label> list'
  info: '<gray>- /<label> info <name>'
  create: '<gray>- /<label> create <name> <size> [title]'
  edit: '<gray>- /<label> edit <name>'
  resize: '<gray>- /<label> resize <name> <size>'
  retitle: '<gray>- /<label> retitle <name> <title>'
  remove: '<gray>- /<label> remove <name>'
  reload: '<gray>- /<label> reload'
  button-command: '<gray>- /<label> button command <menu> <isPlayer> <cmd>'
  button-menu: '<gray>- /<label> button menu <menu> <target>'
  button-remove: '<gray>- /<label> button remove <menu>'
  flag-list: '<gray>- /<label> flag list'
  flag-menu: '<gray>- /<label> flag <menu> menu <flag> <value>'
  flag-button: '<gray>- /<label> flag <menu> button <flag> <value>'

flag-list:
  header: '<#4ECDC4>--- Available Flags ---'
  menu-header: '<#4ECDC4>Menu Flags:'
  menu:
    auto-refresh: '<gray>- auto_refresh <true/false>'
    filler-item: '<gray>- filler_item <material/none>'
    permission: '<gray>- permission <value/none>'
  button-header: '<#4ECDC4>Button Flags:'
  button:
    cooldown: '<gray>- cooldown <seconds>'
    close-on-click: '<gray>- close_on_click <true/false>'
    permission: '<gray>- permission <value/none>'
    cost: '<gray>- cost <value>'
    visible: '<gray>- visible_no_permission <true/false>'
