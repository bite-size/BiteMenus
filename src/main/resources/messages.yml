prefix: '<aqua>[BiteMenus] '
error-prefix: '<red>!! '

# Variables:
# - <label> = command label.
# - <time> = time remaining for cooldown.
# - <menu> = name of the menu currently being interacted with.
# - <menus> = list of all menus.
# - <slot> = number slot that was interacted with.
# - <value> = row or flag value being displayed or set.
# - <cost> = cost of a transaction (e.g. "$10.00").
# - <title> = title of a menu.
# - <size> = size of a menu.
# - <date> = creation date of a menu.
# - <flag> = name of the flag being set.

errors:
  player-not-found: '<red>Player not found.'
  no-permission: '<red>No permission.'
  players-only: '<red>Only players can use this command.'
  usage-open: '<red>Usage: /<label> open <name>'
  menu-not-found: '<red>Menu not found.'
  usage-info: '<red>Usage: /<label> info <name>'
  invalid-name: '<red>Menu name can only contain alphanumeric characters, dashes, and underscores.'
  usage-create: '<red>Usage: /<label> create <name> <size> [title]'
  menu-exists: '<red>Menu already exists.'
  usage-edit: '<red>Usage: /<label> edit <name>'
  usage-resize: '<red>Usage: /<label> resize <name> <size>'
  invalid-size: '<red>Invalid size.'
  invalid-size-bounds: '<red>Size must be a multiple of 9, between 9 and 54.'
  usage-retitle: '<red>Usage: /<label> retitle <name> <title>'
  usage-remove: '<red>Usage: /<label> remove <name>'
  usage-button: '<red>Usage: /<label> button <command|menu|remove> <menu> [args...]'
  usage-button-command: '<red>Usage: /<label> button command <menu> <isPlayer> <cmd>'
  usage-button-menu: '<red>Usage: /<label> button menu <menu> <target>'
  button-not-found: '<red>No button found at slot <slot>.'
  unknown-action: '<red>Unknown button action.'
  usage-flag: '<red>Usage: /<label> flag list OR /<label> flag <menu> menu/button ...'
  usage-flag-general: '<red>Usage: /<label> flag <menu> menu/button <flag> <value>'
  usage-flag-menu: '<red>Usage: /<label> flag <menu> menu <flag> <value>'
  invalid-material: '<red>Invalid Material name.'
  unknown-menu-flag: '<red>Unknown menu flag.'
  usage-flag-button: '<red>Usage: /<label> flag <menu> button <flag> <value>'
  slot-no-button: '<red>This slot does not have a button! Please add one using <yellow>/<label> button command <gray>or <yellow>/<label> button menu<red>.'
  unknown-button-flag: '<red>Unknown button flag.'
  invalid-flag-target: "<red>Target must be 'menu' or 'button'."
  unknown-command: '<red>Unknown command.'
  cooldown: '<red>Please wait <yellow><time> <red>before doing that.'
  insufficient-funds: "<red>You don't have enough money."
  transaction-failed: '<red>Transaction failed.'
  vault-unavailable: '<red>Vault economy is not available! Contact an administrator.'
  invalid-boolean: '<red>Value must be true or false.'
  invalid-number: '<red>Value must be a valid number.'
  invalid-permission: '<red>Invalid permission format.'

messages:
  transaction-success: '<green>Purchased for <cost>.'
  loaded-menus: '<green>Loaded menus: <white><menus>'
  menu-created: '<green>Menu <menu> created.'
  opening-edit: '<green>Opening <menu> in Edit Mode.'
  menu-resized: '<green>Menu <menu> resized to <size>.'
  menu-retitled: '<green>Menu <menu> retitled to <title>.'
  menu-removed: '<green>Menu <menu> removed.'
  plugin-reloaded: '<green>Plugin reloaded.'
  button-command-added: '<green>Added command to slot <slot> in <menu>.'
  button-menu-added: '<green>Added menu link to slot <slot> in <menu>.'
  button-removed: '<green>Cleared actions and flags for slot <slot> in <menu>.'
  click-to-apply-action: '<yellow>Please click the slot you want to apply this action to!'
  flag-menu-set: '<green>Set menu flag <flag> to <value>.'
  flag-button-set: '<green>Set button flag <flag> to <value> at slot <slot>.'
  click-to-apply-flag: '<yellow>Please click the slot you want to apply this flag to!'
  selection-cancelled: '<red>Cancelled selection.'
  edit-mode-saved: '<green>Saved and exited Edit Mode for <menu>.'
  blank-slot-warning: '<yellow>Warning: You assigned a button to a blank slot!'

info:
  header: '<yellow>--- Menu Info: <menu> ---'
  title: '<gray>Title: <white><title>'
  size: '<gray>Size: <white><size>'
  auto-refresh: '<gray>Auto Refresh: <white><value>'
  filler-item: '<gray>Filler Item: <white><value>'
  permission: '<gray>Permission: <white><value>'
  total-buttons: '<gray>Total Buttons: <white><value>'
  created-date: '<gray>Created: <white><date>'

help:
  header: '<yellow>--- BiteMenus Help ---'
  open: '<gray>/<label> open <name>'
  list: '<gray>/<label> list'
  info: '<gray>/<label> info <name>'
  create: '<gray>/<label> create <name> <size> [title]'
  edit: '<gray>/<label> edit <name>'
  resize: '<gray>/<label> resize <name> <size>'
  retitle: '<gray>/<label> retitle <name> <title>'
  remove: '<gray>/<label> remove <name>'
  reload: '<gray>/<label> reload'
  button-command: '<gray>/<label> button command <menu> <isPlayer> <cmd>'
  button-menu: '<gray>/<label> button menu <menu> <target>'
  button-remove: '<gray>/<label> button remove <menu>'
  flag-list: '<gray>/<label> flag list'
  flag-menu: '<gray>/<label> flag <menu> menu <flag> <value>'
  flag-button: '<gray>/<label> flag <menu> button <flag> <value>'

flag-list:
  header: '<yellow>--- Available Flags ---'
  menu-header: '<green>Menu Flags:'
  menu:
    auto-refresh: '<gray>- auto_refresh <true/false>'
    filler-item: '<gray>- filler_item <material/none>'
    permission: '<gray>- permission <value/none>'
  button-header: '<green>Button Flags:'
  button:
    cooldown: '<gray>- cooldown <seconds>'
    close-on-click: '<gray>- close_on_click <true/false>'
    permission: '<gray>- permission <value/none>'
    cost: '<gray>- cost <value>'
    visible: '<gray>- visible_no_permission <true/false>'
